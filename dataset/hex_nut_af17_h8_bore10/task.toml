schema_version = "1.3"
artifacts = ["/workspace/final.py"]

[task]
name = "cad-bench/hex_nut_af17_h8_bore10"
description = "Construct and verify the CAD-bench task hex_nut_af17_h8_bore10."
authors = [{ name = "CAD-bench authors" }]
keywords = ["cad", "build123d", "medium"]

[metadata]
benchmark = "CAD-bench"
category = "mechanical-cad"
difficulty = "medium"
difficulty_weight = 2.0
order = 7

[verifier]
timeout_sec = 7200.0
env = { CAD_BENCH_TASK_ID = "hex_nut_af17_h8_bore10" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/cad-bench/cad-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0

[agent]
timeout_sec = 7200.0

[environment]
docker_image = "ghcr.io/cad-bench/cad-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1200.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
