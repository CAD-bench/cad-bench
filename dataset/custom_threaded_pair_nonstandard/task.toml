schema_version = "1.3"
artifacts = ["/workspace/final.py"]

[task]
name = "cad-bench/custom_threaded_pair_nonstandard"
description = "Construct and verify the CAD-bench task custom_threaded_pair_nonstandard."
authors = [{ name = "CAD-bench authors" }]
keywords = ["cad", "build123d", "insane"]

[metadata]
benchmark = "CAD-bench"
category = "mechanical-cad"
difficulty = "insane"
difficulty_weight = 4.0
order = 15

[verifier]
timeout_sec = 7200.0
env = { CAD_BENCH_TASK_ID = "custom_threaded_pair_nonstandard" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/cad-bench/cad-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0

[agent]
timeout_sec = 7200.0

[environment]
docker_image = "ghcr.io/cad-bench/cad-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1200.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
