[project]
name = "cad-build123d-bench"
version = "0.1.0"
description = "Multi-task Build123D CAD benchmark with geometric and rigid-body functional tasks"
readme = "README.md"
requires-python = "==3.11.*"
keywords = ["cad", "build123d", "benchmark", "rigid-body"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "build123d>=0.10.0",
  "numpy>=2.3.0",
  "trimesh>=4.9.0",
  "matplotlib>=3.10.0",
  "fast-simplification>=0.1.13",
  "huggingface_hub>=0.35.0",
  "openai>=1.0.0",
  "networkx>=3.6.1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.14.0",
]

[project.scripts]
render-cad-views = "bench.runner:render_views_main"
build123d-docs-bundle = "bench.runner:docs_cli"
eval-harness = "bench.runner:eval_harness_main"
export-task-media = "bench.runner:export_task_media_main"
upload-public-tasks = "bench.runner:upload_public_tasks_main"
export-task-canaries = "bench.runner:export_task_canaries_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["."]
include = [
  "README.md",
  "LICENSE",
  "RELEASE.md",
  "pyproject.toml",
  "Dockerfile",
  "bench/**",
  "cad-bench.py",
  "harnesses/**",
  "metadata/**",
  "scripts/**",
  "tasks/**",
  "tests/**",
]
exclude = [
  ".cache/**",
  ".git/**",
  ".pi/**",
  ".pytest_cache/**",
  ".ruff_cache/**",
  ".venv/**",
  "__pycache__/**",
  "dist/**",
  "logs/**",
  "outputs/**",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tasks/*/gold.py" = ["F403", "F405"]
